<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pavlov Cat</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <header>
      <div class="header-brand">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="36" height="36" aria-hidden="true">
          <!-- left ear -->
          <polygon points="8,19 13,5 19,17" fill="currentColor"/>
          <!-- right ear -->
          <polygon points="32,19 27,5 21,17" fill="currentColor"/>
          <!-- head fill -->
          <circle cx="20" cy="25" r="14" fill="currentColor" opacity="0.12"/>
          <!-- head outline -->
          <circle cx="20" cy="25" r="14" fill="none" stroke="currentColor" stroke-width="2"/>
          <!-- eyes -->
          <ellipse cx="15" cy="23" rx="2" ry="2.2" fill="currentColor"/>
          <ellipse cx="25" cy="23" rx="2" ry="2.2" fill="currentColor"/>
          <!-- nose -->
          <path d="M19,28 L20,26.5 L21,28Z" fill="currentColor"/>
          <!-- mouth -->
          <path d="M20,28 C18.5,30 17.5,30 17.5,29 M20,28 C21.5,30 22.5,30 22.5,29" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/>
        </svg>
        <h1>Pavlov Cat</h1>
      </div>
      <div class="mode-tabs" id="mode-tabs">
        <button class="mode-tab active" data-mode="practice">练习</button>
        <button class="mode-tab" data-mode="tuner">调弦</button>
      </div>
    </header>

    <main>
      <div id="practice-view">
      <div id="realtime-panel">
        <div class="rt-controls">
          <div class="rt-control">
            <span class="config-label">参考方式</span>
            <div class="toggle-group" id="rt-refmode-toggles">
              <button class="toggle active" data-value="chromatic">半音阶</button>
              <button class="toggle" data-value="scale">跟音阶</button>
              <button class="toggle" data-value="score">跟乐谱</button>
            </div>
          </div>
          <div class="rt-control hidden" id="rt-score-controls">
            <span class="config-label">乐谱</span>
            <label class="rt-file-btn">导入 MusicXML
              <input type="file" id="rt-file" accept=".musicxml,.xml,.mxl" hidden />
            </label>
            <span id="rt-score-title" class="rt-score-title">未导入</span>
          </div>
          <div class="rt-control" id="rt-scale-controls">
            <span class="config-label">调</span>
            <select id="rt-key" class="rt-select"></select>
            <span class="config-label">音准标准</span>
            <div class="toggle-group" id="rt-temperament-toggles" title="标准=平均律,通用;更协和=纯律,某些音更贴合和声、更干净。不确定就用标准。">
              <button class="toggle active" data-value="equal">标准</button>
              <button class="toggle" data-value="just">更协和</button>
            </div>
          </div>
          <div class="rt-control">
            <span class="config-label">音域</span>
            <select id="rt-range-lo" class="rt-select"></select>
            <span class="rt-range-sep">–</span>
            <select id="rt-range-hi" class="rt-select"></select>
          </div>
          <div class="rt-control">
            <span class="config-label">BPM</span>
            <input id="rt-bpm" type="number" min="40" max="220" step="1" value="80" />
          </div>
          <div class="rt-control">
            <span class="config-label">每 N 拍重音</span>
            <input id="rt-accent" type="number" min="1" max="12" step="1" value="4" />
          </div>
          <div class="rt-control">
            <span class="config-label">显示拍数</span>
            <input id="rt-visible-beats" type="number" min="4" max="32" step="1" value="32" />
          </div>
          <div class="rt-control">
            <span class="config-label">音色</span>
            <select id="rt-sound" class="rt-select">
              <option value="wood">木质打点</option>
              <option value="click">电子 click</option>
              <option value="tom" selected>低音鼓点</option>
              <option value="hihat">Hi-hat</option>
            </select>
          </div>
          <div class="rt-control">
            <span class="config-label">节拍器</span>
            <div class="toggle-group" id="rt-metronome-toggles">
              <button class="toggle" data-value="on">开</button>
              <button class="toggle active" data-value="off">关</button>
            </div>
          </div>
          <div class="rt-control">
            <span class="config-label">音准判定</span>
            <div class="toggle-group" id="rt-judge-toggles">
              <button class="toggle active" data-value="on">开</button>
              <button class="toggle" data-value="off">关</button>
            </div>
          </div>
          <div class="rt-control">
            <span class="config-label">音准容差 (¢)</span>
            <input id="rt-cents-good" type="number" min="1" max="50" step="1" value="6" title="绿色阈值：误差 ≤ 此值（音分）" />
            <span class="rt-range-sep">/</span>
            <input id="rt-cents-med" type="number" min="2" max="100" step="1" value="15" title="黄色阈值：误差 ≤ 此值（音分），超出则红色" />
          </div>
          <div class="rt-control">
            <span class="config-label">时间单位</span>
            <div class="toggle-group" id="rt-unit-toggles">
              <button class="toggle active" data-value="beat">拍</button>
              <button class="toggle" data-value="second">秒</button>
            </div>
          </div>
          <div class="rt-control">
            <span class="config-label">参考音</span>
            <div class="toggle-group" id="rt-drone-toggles">
              <button class="toggle active" data-value="off">关</button>
              <button class="toggle" data-value="root">主音</button>
              <button class="toggle" data-value="fifth">主音+五度</button>
            </div>
            <select id="rt-drone-root" class="rt-select" title="参考长音的音高(拉琴时用它对音准)"></select>
          </div>
          <div class="rt-control">
            <span class="config-label">麦克风</span>
            <select id="rt-mic" class="rt-select" title="选择收音设备。Mac mini 无内置麦时,可选 iPhone(连续互通麦克风)"></select>
          </div>
        </div>
        <div class="rt-canvas-wrap" id="rt-canvas-wrap">
          <canvas id="realtime-canvas"></canvas>
          <div class="rt-canvas-actions">
            <button id="rt-start" class="rt-overlay-btn rt-overlay-btn-primary">▶ 开始</button>
            <button id="rt-clear" class="rt-overlay-btn" title="清除当前会话的音高轨迹">🗑 清除</button>
            <button id="rt-record" class="rt-overlay-btn" title="录下你的演奏(可下载发给老师)">🎙 录音</button>
            <button id="rt-export" class="rt-overlay-btn" title="把当前画面导出为图片">📷 导出图</button>
          </div>
          <button id="rt-fullscreen" class="rt-fullscreen-btn" title="全屏 / 退出全屏" aria-label="全屏">⛶</button>
        </div>
        <div class="rt-readout">
          <span id="rt-pitch" class="rt-pitch">— Hz</span>
          <span id="rt-status" class="rt-status"></span>
        </div>
        <div id="rt-report" class="rt-report hidden"></div>
      </div>
      </div>

      <div id="tuner-view" class="hidden">
        <div class="tuner-card">
          <div class="tuner-note" id="tuner-note">—</div>
          <div class="tuner-cents" id="tuner-cents">按「开始」并拉一个空弦</div>
          <div class="tuner-bar">
            <div class="tuner-center"></div>
            <div class="tuner-needle" id="tuner-needle"></div>
          </div>
          <div class="tuner-scale">
            <span>偏低 ♭</span><span>准</span><span>偏高 ♯</span>
          </div>
          <div class="tuner-strings" id="tuner-strings">
            <span class="tuner-string" data-midi="55">G</span>
            <span class="tuner-string" data-midi="62">D</span>
            <span class="tuner-string" data-midi="69">A</span>
            <span class="tuner-string" data-midi="76">E</span>
          </div>
          <button id="tuner-start" class="rt-overlay-btn rt-overlay-btn-primary tuner-start">▶ 开始</button>
          <p class="tuner-hint">拉空弦,让指针停在正中间。偏左=音偏低(把弦调紧一点),偏右=音偏高(调松一点)。基准 A4 = 442 Hz。</p>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
